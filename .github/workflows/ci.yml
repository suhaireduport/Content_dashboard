name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A push to main waits for the running suite instead of cancelling it;
  # a new commit on a pull request still replaces that PR's older run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          STAFF_USERNAME: ${{ secrets.STAFF_USERNAME }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          # The server works in India time; the Status page fills "Publish date and time"
          # from the browser clock, and a UTC clock makes every new status "in the past".
          TZ: Asia/Kolkata
        # Rewrite the HTML report after every test, so a cancelled or timed-out
        # run still uploads the results it reached
        run: pytest -o generate_report_on_test=true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report-attempt-${{ github.run_attempt }}
          path: reports/report.html
          if-no-files-found: warn
          retention-days: 14

[pytest]
testpaths = tests
# Disable the pytest-playwright plugin (if installed) so its --headed flag can't be used;
# headless / headed is set only by HEADLESS in conftest.py.
# Every run writes a single-file HTML report (pytest-html) to reports/report.html.
addopts = -v -rs -p no:playwright --html=reports/report.html --self-contained-html
